name: Nightly
on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: zulu, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Navidrome
        run: |
          docker compose -f ci/navidrome.compose.yml up -d --wait
          # Navidrome's default library (ID 1) is pinned to the compose file's first mount and
          # cannot be repointed or deleted via its API, so the two fixture subtrees are mounted
          # at disjoint container paths and rewired into "Music" + "Audiobooks" libraries here —
          # see ci/configure-libraries.sh's header comment for the evidence.
          ./ci/configure-libraries.sh
          # Do NOT poll scanning==false: it is already false before the startup
          # scan begins. Poll the expected track count instead.
          Q='v=1.16.1&c=ci&f=json&u=admin&p=testpass'
          for i in $(seq 1 60); do
            n=$(wget -qO- "http://localhost:4533/rest/getScanStatus.view?$Q" \
                | grep -o '"count":[0-9]*' | head -1 | cut -d: -f2)
            [ "$n" = "4" ] && break
            sleep 1
          done
          test "$n" = "4"

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb reverse tcp:4533 tcp:4533
            ./gradlew :app:connectedDebugAndroidTest
