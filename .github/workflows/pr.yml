name: PR

# Triggers on `master` — this repository's actual default branch (`git branch -a` / GitHub both
# confirm it). The Java implementation's version of this file triggered on `main`, a branch that
# does not exist here, so it silently never ran on any push — a gate that cannot fire is worse than
# no gate. Do not "fix" this back to `main` without first checking the default branch again.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, cheap build-hygiene checks first: `ConventionTest` guards the build itself (no module
  # configuring android/kotlin blocks directly, no mock framework on any classpath, no kapt — see
  # its own doc), and `lint` is AGP's own static analysis across every Android module. Neither
  # needs a JVM test run or a container, so this is the cheapest possible thing to fail on.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Convention rules
        run: ./gradlew :app:testDebugUnitTest --tests '*ConventionTest*'

      - name: No mock framework on any test classpath
        # ConventionTest scans *declared* names; this resolves every test runtime classpath and
        # catches one arriving transitively. Two guards, deliberately: the textual one runs in
        # seconds with no resolution, this one is the real answer.
        #
        # The bare (unqualified) task name, like `verifyReleaseNoDestructiveMigration` below: the
        # root build script registers this task in every project that has a `check` task, and
        # Gradle resolves an unqualified name against all of them -- so a future module is covered
        # without anyone remembering to add a line here.
        run: ./gradlew verifyNoMockFrameworks

      - name: Android Lint
        run: ./gradlew lint

      - name: Merged manifest
        # `usesCleartextTraffic` exists in this repository only in `app/src/debug/
        # AndroidManifest.xml`, for the Tier 2 journey's plain-HTTP container. This proves it does
        # not reach the *merged* release manifest — the artifact that actually ships, and the one
        # a dependency's own manifest could inject it into. See `verifyReleaseManifest` in
        # AndroidApplicationConventionPlugin.
        #
        # Both variants, since Plan 3 Task 5. The same task now also proves a set of declarations is
        # *present* -- the playback service and its three permissions, which reach the application
        # from `:core:media`'s own manifest through the merger -- and that half runs for every
        # variant, because a missing FOREGROUND_SERVICE_MEDIA_PLAYBACK is wrong in debug too. It
        # fails no build, no install and no foreground test; it throws SecurityException from
        # `startForeground` the first time the app is backgrounded with audio playing.
        run: ./gradlew :app:verifyReleaseManifest :app:verifyDebugManifest

      # `check` compiles neither androidTest nor the release variant, so a source
      # set can break -- or a security control in it can stop compiling -- with
      # every gate green. `app/src/release/kotlin/.../CleartextPolicyModule.kt` is
      # the whole release-side cleartext refusal and was verified exactly once, by
      # hand, when it was written. Same shape as the broken device tier this repo
      # already carried for hours: two lanes green apart, green together, tier dead.
      - name: Compile the gates check does not
        run: ./gradlew :app:compileReleaseKotlin :core:media:compileDebugAndroidTestKotlin :app:compileDebugAndroidTestKotlin

      - name: No destructive migration without a named exemption
        # DataModule.provideDatabase's fallbackToDestructiveMigration call must never reach a
        # release build (see VerifyNoDestructiveMigrationTask): the first post-release schema bump
        # would silently delete every stored audiobook position. The call is legitimately present
        # throughout this pre-release plan, so this passes today only because
        # core/database/DESTRUCTIVE_MIGRATION_EXEMPTION.md exists — and prints a loud warning
        # naming that file every time it does, so the exemption cannot go unnoticed. Deleting that
        # file without replacing the call with real Migration objects is what turns this step red.
        #
        # The bare (unqualified) task name, not `:core:database:verifyReleaseNoDestructiveMigration`:
        # AndroidRoomConventionPlugin registers this task for every module that applies
        # muplay.android.room, and Gradle resolves an unqualified task name against every project
        # that has one — so a future second Room module gets this step for free instead of needing
        # a second hardcoded line here that someone has to remember to add.
        run: ./gradlew verifyReleaseNoDestructiveMigration

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*

  # Every JVM test across every module (`./gradlew test` — the lifecycle task every module,
  # Android or plain java-library, exposes; for the Android modules it already resolves to exactly
  # `testDebugUnitTest`, so this one task covers all six modules with no per-module enumeration to
  # keep in sync). `LiveNavidromeTest` (core/network) is excluded here — it is tagged "live" and
  # needs the real container the `live-navidrome` job below starts; see `Testing.kt`'s
  # `configureJUnit5`.
  #
  # Plus the half of the coverage table this tier can honestly evaluate — see the step's own
  # comment below for where the line falls and why.
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test

      - name: Coverage gate (JVM floors)
        # Every floor in `coverageFloors` (root build.gradle.kts) that can be measured without an
        # emulator: all the BRANCH floors — `:core:model`, `:core:network`, `:core:testing` and
        # `:feature:setup`'s three. Measured, and provably able to fail: deleting a
        # `SetupFailureReasonTest` case drops `SetupFailureReasonKt` to 0.00 against its 0.85 and
        # this step goes red.
        #
        # Not the whole table. The three LINE floors (`:app`, `:core:designsystem`,
        # `:feature:setup`'s `SetupScreenKt`) exist over `@Composable` code, which only executes
        # inside a real composition, so with no instrumented data they measure ~0% and would fail
        # every run here. Those are enforced by `jacocoTestCoverageVerification` in
        # `.github/workflows/e2e.yml`, which is required to merge exactly like this workflow. The
        # task below says out loud, per module, how many floors it enforced and how many it left
        # to that one — a tier that skipped half the table silently would be worse than no gate.
        run: ./gradlew jacocoJvmCoverageVerification

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-integration-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**

  # Runs LiveNavidromeTest (core/network) against a real, pinned deluan/navidrome:0.63.2 container
  # — not a fixture, not MockWebServer. Docker is not an emulator: the container starts in 5-11s
  # (measured), well inside this job's own 10-minute budget, so anything whose subject is genuinely
  # Navidrome's own behaviour (does a wrong password actually get rejected? do the two libraries
  # ci/configure-libraries.sh wires up actually come back with those names?) is proven here, live,
  # rather than deferred to Task 8's emulator tier or left resting on a captured-fixture stand-in.
  live-navidrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify audio fixtures
        # `ci/fixtures.md5` is written by `ci/seed-fixtures.sh` and, until this step existed, read
        # by nothing — a checksum file with no verifier, which is the same shape as a floor that
        # cannot fail. The four files it covers are the audio Navidrome scans: `LiveNavidromeTest`
        # asserts on the libraries built from them and the Tier 2 journey asserts on their names,
        # so a corrupted or re-encoded fixture would move what both tiers measure. The script's
        # `-bitexact` ffmpeg flags exist precisely so these checksums are reproducible.
        run: md5sum -c ci/fixtures.md5

      - name: Verify chapter oracle
        # `books.tsv` is what Task 3 asserts Media3 against, so it has to be re-derivable from the
        # committed audio rather than taken on trust. This step re-runs ffprobe over the fixtures
        # and diffs; it never re-encodes, which is why it can run here while `ci/seed-fixtures.sh`
        # cannot (its output is bit-reproducible only for one ffmpeg version). A drifted oracle
        # would let a chapter reader that returns last week's answer stay green.
        #
        # Distinct from the `md5sum -c` above rather than redundant with it: that one proves the
        # bytes did not move, this one proves the *recorded meaning* of those bytes did not. A
        # fixture regenerated by a different ffmpeg fails the first; a hand-edited `books.tsv`
        # fails only the second.
        run: |
          command -v ffprobe > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ./ci/probe-chapters.sh --check

      - name: Start Navidrome
        run: docker compose -f ci/navidrome.compose.yml up -d --wait

      - name: Configure libraries
        # Library 1 is pinned to its mount path and cannot be renamed-by-repointing or deleted —
        # this drives Navidrome's native REST API to rename it "Music" and create the second
        # "Audiobooks" library, then waits for both to finish scanning. See the script's own header
        # comment for the full, empirically-confirmed explanation.
        run: ./ci/configure-libraries.sh

      - name: Live Navidrome tests
        run: ./gradlew :core:network:liveNavidromeTest

      - name: Stop Navidrome
        if: always()
        run: docker compose -f ci/navidrome.compose.yml down -v

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-navidrome-reports
          path: core/network/build/reports/tests/liveNavidromeTest/**

  # "Contract": this job proves the *oracle* is sound -- `OpenApiFixtureValidator` and its own test
  # suite, both of which live entirely in :core:testing, over inline JSON of its own. Isolated from
  # the much larger unit+integration run so a drift in the vendored spec's meaning is visible as
  # its own failing gate rather than buried in a 70-plus-test run across five other modules.
  #
  # It validates **no committed fixture**, and an earlier version of this comment said it did
  # ("every fixture validated against the vendored OpenSubsonic OpenAPI spec") while contradicting
  # itself two sentences later. All eight fixture validations are `assertValid` calls in
  # `core/network/.../SubsonicClientTest.kt`, which the `unit-integration` job above runs -- so
  # they are genuinely checked on every PR, just not here. If `:core:network`'s tests were ever
  # disabled, the job named `contract` would still be green.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: OpenAPI oracle self-tests
        run: ./gradlew :core:testing:test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-reports
          path: core/testing/build/reports/tests/**
