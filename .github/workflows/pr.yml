name: PR

# Triggers on `master` — this repository's actual default branch (`git branch -a` / GitHub both
# confirm it). The Java implementation's version of this file triggered on `main`, a branch that
# does not exist here, so it silently never ran on any push — a gate that cannot fire is worse than
# no gate. Do not "fix" this back to `main` without first checking the default branch again.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, cheap build-hygiene checks first: `ConventionTest` guards the build itself (no module
  # configuring android/kotlin blocks directly, no mock framework on any classpath, no kapt — see
  # its own doc), and `lint` is AGP's own static analysis across every Android module. Neither
  # needs a JVM test run or a container, so this is the cheapest possible thing to fail on.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Convention rules
        run: ./gradlew :app:testDebugUnitTest --tests '*ConventionTest*'

      - name: Android Lint
        run: ./gradlew lint

      - name: Release manifest
        # `usesCleartextTraffic` exists in this repository only in `app/src/debug/
        # AndroidManifest.xml`, for the Tier 2 journey's plain-HTTP container. This proves it does
        # not reach the *merged* release manifest — the artifact that actually ships, and the one
        # a dependency's own manifest could inject it into. See `verifyReleaseManifest` in
        # AndroidApplicationConventionPlugin.
        run: ./gradlew :app:verifyReleaseManifest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*

  # Every JVM test across every module (`./gradlew test` — the lifecycle task every module,
  # Android or plain java-library, exposes; for the Android modules it already resolves to exactly
  # `testDebugUnitTest`, so this one task covers all six modules with no per-module enumeration to
  # keep in sync). `LiveNavidromeTest` (core/network) is excluded here — it is tagged "live" and
  # needs the real container the `live-navidrome` job below starts; see `Testing.kt`'s
  # `configureJUnit5`.
  #
  # No coverage step here, deliberately, and this is not a weakening of Tier 1. `coverageFloors`
  # (root build.gradle.kts) is measured against `Jacoco.kt`'s *merged* JVM + instrumented
  # execution data, and Task 8 gave the Compose-bearing classes real LINE floors that only the
  # emulator journey can reach. A gate run here, with the instrumented half absent, would measure
  # those classes at 0% and fail every run — so `jacocoTestReport`/`jacocoTestCoverageVerification`
  # run in `.github/workflows/e2e.yml` instead, which is the one job where both halves of the
  # merge exist. That workflow is required to merge exactly like this one.
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-integration-reports
          path: |
            **/build/reports/tests/**

  # Runs LiveNavidromeTest (core/network) against a real, pinned deluan/navidrome:0.63.2 container
  # — not a fixture, not MockWebServer. Docker is not an emulator: the container starts in 5-11s
  # (measured), well inside this job's own 10-minute budget, so anything whose subject is genuinely
  # Navidrome's own behaviour (does a wrong password actually get rejected? do the two libraries
  # ci/configure-libraries.sh wires up actually come back with those names?) is proven here, live,
  # rather than deferred to Task 8's emulator tier or left resting on a captured-fixture stand-in.
  live-navidrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Start Navidrome
        run: docker compose -f ci/navidrome.compose.yml up -d --wait

      - name: Configure libraries
        # Library 1 is pinned to its mount path and cannot be renamed-by-repointing or deleted —
        # this drives Navidrome's native REST API to rename it "Music" and create the second
        # "Audiobooks" library, then waits for both to finish scanning. See the script's own header
        # comment for the full, empirically-confirmed explanation.
        run: ./ci/configure-libraries.sh

      - name: Live Navidrome tests
        run: ./gradlew :core:network:liveNavidromeTest

      - name: Stop Navidrome
        if: always()
        run: docker compose -f ci/navidrome.compose.yml down -v

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-navidrome-reports
          path: core/network/build/reports/tests/liveNavidromeTest/**

  # "Contract": every fixture validated against the vendored OpenSubsonic OpenAPI spec (see
  # docs/superpowers/specs/2026-08-22-muplay-kotlin-design.md's own test-tier table). That oracle
  # -- OpenApiFixtureValidator -- and its own test suite live entirely in :core:testing, so this
  # job's one purpose is proving the oracle itself is sound, isolated from the much larger
  # unit+integration run so a drift in the vendored spec's meaning is visible as its own failing
  # gate, not buried inside a 70-plus-test run covering five other modules too.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: OpenAPI fixture contract tests
        run: ./gradlew :core:testing:test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-reports
          path: core/testing/build/reports/tests/**
