name: E2E

# Tier 2. **Required to merge** — not nightly, not advisory. It is the only tier that runs the
# app itself: a real debug APK, on a real emulator, against the same real Navidrome container
# Tier 1's `live-navidrome` job uses. Same triggers as `.github/workflows/pr.yml` (see that file's
# own note on why `master`, not `main`) so both tiers gate the same events.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Slower than every Tier 1 job put together, and deliberately kept: this is the tier that proves
  # the first-run journey actually works end to end, and it is also the only source of
  # *instrumented* coverage data in this build. Both of those are load-bearing — see the coverage
  # steps at the bottom of this job.
  first-run-journey:
    runs-on: ubuntu-latest
    # An emulator boot plus a full debug + androidTest assembly is the bulk of this; 45 minutes is
    # slack over the measured local run, not a target.
    #
    # **Raised from 45 to 60 at Plan 3 Task 10, and here is what was measured rather than
    # guessed.** On the same 24-core/47 GB machine, with every APK already assembled, the four
    # connected suites in the `script:` block below take **7 min 43 s** wall clock end to end
    # (`:core:media` 119 tests, `:core:database` 120, `:app` 31, `:feature:player` 24 = 294), and
    # the two coverage steps at the bottom of this job take a further **2 min 26 s** (the report
    # step runs every module's JVM `test` task). That is ~10 minutes of *measured* work before an
    # emulator has been downloaded or booted and before a single line has been compiled on a
    # 4-core runner. It was ~1 minute of test execution when 45 was chosen.
    #
    # This job now plays real audio in real time, repeatedly, and that part is irreducible:
    # `GaplessTest` alone runs two 15-second experiments, `PlaybackJourneyTest` is 58 s of which
    # most is spent waiting for a position readout to actually reach a later second, and
    # `MuPlaybackServiceTest` plays several seconds more, several times over. No hardware removes
    # it. A gate that starts flaking on its own time limit gets disabled, which is the worst
    # outcome available here, so the limit moves with the evidence.
    #
    # The alternative -- splitting this into two emulator jobs, module suites and app journeys --
    # was considered and rejected for now: it doubles the ~2 GB system-image pull and the emulator
    # boot, which are the two largest costs in the job and the two least related to what is being
    # tested, and it would split the *merged* coverage data this job is the only source of. Revisit
    # if a real CI run lands past 45 with the emulator time excluded.
    #
    # The earlier note, kept because its measurement is still the one for `:core:media` alone:
    # left at 45 when `:core:media` joined the script below (Plan 3 Task 2), and the measurement
    # behind that: on the same 24-core/47 GB machine Plan 2 Task 10 measured, that suite adds
    # **1 min 16 s** with every task forced to re-run (`--rerun-tasks`, i.e. a fresh assembly,
    # install and run of its debug + androidTest APKs) and **30 s** warm; its nine tests are
    # 15.8 s of that. What a local figure cannot cover is still what it could not cover then --
    # the ~2 GB system-image pull, the emulator boot, and a cold assembly on a 4-core runner -- so
    # this remains evidence that the *test* half is nowhere near the budget rather than a
    # measurement of the job. Nothing measurable here justifies moving the limit; the first real
    # CI run is what should be read before anyone does.
    timeout-minutes: 60
    # The AVD coordinates, written once. Every step below reads them from here, and
    # `ConventionTest`'s "the emulator coordinates cannot drift" asserts they equal
    # `ci/prepare-emulator.sh`'s own declarations — the same shape as the
    # `LIVE_NAVIDROME_TEST_TASK_NAME` sync this project already enforces rather than trusting.
    env:
      EMULATOR_API_LEVEL: "37.0"
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
      # The emulator the Minigbm workaround below was measured against, pinned like
      # `deluan/navidrome:0.63.2` and every catalogue entry. 15917651 is emulator 37.1.11.
      EMULATOR_BUILD: "15917651"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # Without this the emulator falls back to software CPU emulation and the job takes long
      # enough to hit its own timeout. GitHub's Linux runners expose /dev/kvm but leave it
      # root-only; this is the standard udev rule from android-emulator-runner's own README.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify audio fixtures
        # `ci/fixtures.md5` is written by `ci/seed-fixtures.sh` and, until this step existed, read
        # by nothing — a checksum file with no verifier, which is the same shape as a floor that
        # cannot fail. The four files it covers are the audio Navidrome scans: `LiveNavidromeTest`
        # asserts on the libraries built from them and the Tier 2 journey asserts on their names,
        # so a corrupted or re-encoded fixture would move what both tiers measure. The script's
        # `-bitexact` ffmpeg flags exist precisely so these checksums are reproducible.
        run: md5sum -c ci/fixtures.md5

      - name: Verify chapter oracle
        # `books.tsv` is what Task 3 asserts Media3 against, so it has to be re-derivable from the
        # committed audio rather than taken on trust. This step re-runs ffprobe over the fixtures
        # and diffs; it never re-encodes, which is why it can run here while `ci/seed-fixtures.sh`
        # cannot (its output is bit-reproducible only for one ffmpeg version). A drifted oracle
        # would let a chapter reader that returns last week's answer stay green.
        #
        # Distinct from the `md5sum -c` above rather than redundant with it: that one proves the
        # bytes did not move, this one proves the *recorded meaning* of those bytes did not. A
        # fixture regenerated by a different ffmpeg fails the first; a hand-edited `books.tsv`
        # fails only the second.
        run: |
          command -v ffprobe > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ./ci/probe-chapters.sh --check

      - name: Start Navidrome
        run: docker compose -f ci/navidrome.compose.yml up -d --wait

      - name: Configure libraries
        # Renames Navidrome's pinned library 1 to "Music", creates "Audiobooks", and waits for
        # both to finish scanning. FirstRunJourneyTest asserts on exactly those two names, so this
        # step is what the journey's final assertion is a contract *on* — see the script's own
        # header comment.
        run: ./ci/configure-libraries.sh

      # The emulator action interpolates `api-level`/`target`/`arch` verbatim into
      # `platforms;android-<api-level>` and `system-images;android-<api-level>;<target>;<arch>`
      # and hands them to `sdkmanager`. A value that does not name a real package therefore fails
      # deep inside the action, at AVD creation, with an error that does not say which string was
      # wrong — which is exactly how `api-level: 37` (no such package; only 37.0/37.1/37.2-beta*
      # exist) shipped once. This resolves both strings against Google's live repository first, so
      # a bad coordinate fails here, by name, in seconds.
      #
      # `ConventionTest` separately holds these three values equal to `ci/prepare-emulator.sh`'s
      # own declarations, so the workflow and the local run cannot drift apart; this step is what
      # catches them being wrong *together*.
      - name: Resolve SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          available="$("$sdkmanager" --list)"
          status=0
          platform="platforms;android-$EMULATOR_API_LEVEL"
          image="system-images;android-$EMULATOR_API_LEVEL;$EMULATOR_TARGET;$EMULATOR_ARCH"
          for pkg in "$platform" "$image"; do
            # An exact match on the whole first column, not `grep -F`: `sdkmanager --list` prints
            # `  <package> | <rev> | <description> | <path>`, and a substring test passes
            # `platforms;android-37` against the line for `platforms;android-37.0` -- i.e. it
            # would have waved through the exact value this step exists to reject. Verified by
            # running this step locally with both values.
            #
            # A here-string rather than a pipe into the matcher, for the same reason `grep -q`
            # would be wrong here: an early-exiting matcher SIGPIPEs its writer, which under
            # `pipefail` makes the pipeline non-zero and inverts the test.
            matches_exactly='{ name = $1; gsub(/^[ \t]+|[ \t]+$/, "", name); if (name == pkg) found = 1 }
                             END { exit !found }'
            if awk -F'|' -v pkg="$pkg" "$matches_exactly" <<< "$available"; then
              echo "ok: $pkg"
            else
              echo "::error::'$pkg' is not a package Google publishes. Check api-level/target/arch"
              echo "::error::in this workflow and the matching declarations in ci/prepare-emulator.sh"
              status=1
            fi
          done
          # The pinned emulator is *not* an SDK package: the action downloads it straight from
          # dl.google.com with `curl -fo`, at a URL it builds from the build id (for a build id
          # >= 8000000 on non-ARM Linux, exactly the path below). A wrong or withdrawn id would
          # therefore die deep inside the action with no name attached -- structurally the same
          # failure as `api-level: 37` was -- so it is resolved here beside the two packages
          # rather than left as the one coordinate nothing checks.
          emulator_zip="https://dl.google.com/android/repository/emulator-linux_x64-$EMULATOR_BUILD.zip"
          if curl -fsI "$emulator_zip" > /dev/null; then
            echo "ok: emulator build $EMULATOR_BUILD"
          else
            echo "::error::emulator build '$EMULATOR_BUILD' is not downloadable at $emulator_zip"
            status=1
          fi
          exit "$status"

      # The two most likely first failures on a runner this job has never run on are the
      # 45-minute timeout and disk exhaustion during the ~2 GB system-image pull — and neither
      # would be diagnosable after the fact, because an emulator killed by memory or disk pressure
      # produces the same `INSTRUMENTATION_ABORTED: System has crashed` signature as the gralloc
      # bug `ci/prepare-emulator.sh` documents. This job was developed on 24 cores / 47 GB;
      # `ubuntu-latest` is 4 cores / 16 GB with ~14 GB free. Recording the numbers costs a second
      # and makes the first failure readable.
      - name: Host capacity
        run: |
          df -h
          free -h
          nproc

      - name: First-run journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # `37.0`, not `37`: there is no `platforms;android-37` or
          # `system-images;android-37;google_apis;x86_64` — API 36 has a bare alias, API 37 does
          # not. Held equal to `ci/prepare-emulator.sh`'s own declarations by `ConventionTest`,
          # and resolved against Google's repository by the step above.
          #
          # `system-image-api-level` defaults to `api-level` when unset; stated explicitly so the
          # two cannot be read as independently choosable.
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          system-image-api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          # Without this the action installs whatever the stable channel offers on the day, and
          # the one thing this gate cannot afford is a silently-changing emulator underneath a
          # workaround for an emulator bug. Read from the job `env:` above so the preflight step
          # checks the same value the action downloads; `ConventionTest` asserts that.
          emulator-build: ${{ env.EMULATOR_BUILD }}
          # Headless, no audio device, and swiftshader for GL: a CI runner has no display, no
          # sound card and no GPU. `-no-snapshot` keeps every run from a clean boot rather than a
          # saved image whose state nothing in this repository controls.
          #
          # `-feature Minigbm -prop qemu.hardware.gralloc=minigbm` is **required**, not tuning:
          # without it this emulator + system-image pair aborts SurfaceFlinger and system_server
          # on every CPU read of a graphics buffer, which happens at every activity teardown, and
          # the run dies with "INSTRUMENTATION_ABORTED: System has crashed". The full crash
          # signature, the evidence, and the reason it is delivered as a boot flag are in
          # `ci/prepare-emulator.sh`'s own header — which also fails fast if the device it is
          # handed does not have it.
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
            -camera-back none -camera-front none
            -feature Minigbm -prop qemu.hardware.gralloc=minigbm
          # `ci/prepare-emulator.sh` first, and in the same shell: it waits for the framework
          # (never a fixed sleep), checks the gralloc flag above actually took, and sets up the
          # `adb reverse` that makes `http://localhost:4533` inside the emulator reach the
          # container started above. A missing reverse forward does not fail loudly — the app's
          # connection attempt simply times out — so this is not something to leave to a separate
          # step that could be reordered away from the test.
          #
          # The logcat dump has to happen *here*, inside the action's own step, because the action
          # shuts the emulator down as that step ends — a later `adb logcat` step would find no
          # device. `parseScript` runs each line as its own `sh -c` that throws on a non-zero
          # status, so the `|| { …; exit 1; }` keeps the failure while capturing the one artifact
          # that distinguishes an emulator the host killed from an app that crashed: both surface
          # as the same `INSTRUMENTATION_ABORTED: System has crashed` this project has already
          # chased once (see `ci/prepare-emulator.sh`).
          #
          # `:core:media` joined in Plan 3 Task 2 and is the only suite here that plays audio: it
          # pulls one real MP3 off the container through a real stream URL, serves it back through
          # a `MockWebServer` (the one thing faked is the ability to answer 429 on demand) and
          # asserts that a real `ExoPlayer`'s own position advanced past a second of it. It is also
          # the only place the 429 retry budget is exercised against a real `Loader`. Its four
          # `MuPlayDataSourceFactoryTest` cases are the slow ones at ~14 s of the suite's 15.8 s;
          # `NavidromeLoadErrorHandlingPolicyTest`'s five are 16 ms together.
          #
          # `:feature:player` joined in Plan 3 Task 10, and its omission was a gate that ran
          # nothing: that module has carried 24 instrumented tests since Task 9 -- the positional
          # assertions that are the only thing standing between a title/artist swap and a green
          # build, plus the two security assertions that dump the whole semantics tree and require
          # it to contain neither an auth token nor a salt -- and no CI job ran a single one of
          # them. Measured: `:app`'s `PlaybackJourneyTest` happens to cover that module's four
          # `requiresInstrumentedData` coverage floors on its own (`PlayerScreenKt` 59/61,
          # `MiniPlayerKt` 48/49, `ArtworkKt` 21/21, `PlayerViewModel$1` 10/10, with
          # `:feature:player`'s own `.ec` deleted), so the coverage gate below would *not* have
          # caught the omission either. `ConventionTest`'s `every module with instrumented tests is
          # run by the emulator job` now holds this list against the repository, so the next module
          # to grow a `src/androidTest` cannot be forgotten here -- and it earned its place on the first
          # merge after it was written: `:integrations:core` (17 instrumented tests, Plan 7) was in
          # exactly the same position, found by that rule, and is now named here too.
          script: |
            ./ci/prepare-emulator.sh
            ./gradlew :core:database:connectedDebugAndroidTest :core:media:connectedDebugAndroidTest :feature:player:connectedDebugAndroidTest :integrations:core:connectedDebugAndroidTest :integrations:lidarr:connectedDebugAndroidTest :integrations:bindery:connectedDebugAndroidTest :integrations:requests:connectedDebugAndroidTest :app:connectedDebugAndroidTest || { adb logcat -d > emulator-logcat.txt; exit 1; }

      # The *whole* coverage table, every floor, against merged JVM + instrumented execution data
      # — which only exists here, after the journey above. Tier 1 already enforced the subset that
      # needs no device (`jacocoJvmCoverageVerification`, see pr.yml); this task is a superset of
      # that one, so the fast gate having passed is never taken as licence to skip anything.
      # `jacocoTestReport` pulls in each module's own `test` task, so the JVM half is produced
      # here rather than assumed from another job's workspace.
      - name: Coverage report
        run: ./gradlew jacocoTestReport

      - name: Coverage gate
        run: ./gradlew jacocoTestCoverageVerification

      - name: Stop Navidrome
        if: always()
        run: docker compose -f ci/navidrome.compose.yml down -v

      # `**/build/reports/androidTests/**`, not `app/build/...`: this step listed only `:app`'s
      # report while the `script:` above has been running `:core:database`'s suite since Plan 2
      # Task 10 -- so a failure in any module but `:app` uploaded a logcat and no test report at
      # all. `:core:media` joining in Plan 3 Task 2 is what made that visible; the glob fixes it
      # for every module at once rather than adding a third hardcoded path. The comment lives out
      # here rather than inside the `path: |` block on purpose: that is a literal block scalar, and
      # a `#` line inside it is a path pattern, not a comment.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            **/build/reports/androidTests/**
            **/build/reports/jacoco/**
            emulator-logcat.txt
