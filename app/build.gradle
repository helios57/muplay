plugins {
  id 'com.android.application'
  id 'com.google.dagger.hilt.android'
}
android {
  namespace 'app.muplay'
  compileSdk 37
  defaultConfig {
    applicationId 'app.muplay'
    minSdk 26
    targetSdk 36
    versionCode 1
    versionName '0.1.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// ArchitectureTest (:app's only unit test class today) scans the filesystem directly with
// Files.walk rather than declaring its true inputs (every source file in the repo) to Gradle, so
// a .kt file appearing after a warm local build would not invalidate testDebugUnitTest's
// UP-TO-DATE cache -- Gradle only knows about this task's declared classpath/output, not the
// files ArchitectureTest happens to read at runtime. Since noModuleAppliesTheKotlinPluginExplicitly
// cannot catch AGP's own built-in Kotlin support (see its Javadoc), the filesystem-level bans
// (noKotlinSourceFilesExist, noKotlinFilesExistAnywhere) in this same task are now the *sole*
// guard against Kotlin actually compiling -- a stale UP-TO-DATE pass here is not an acceptable
// local-dev shortcut for the project's hardest constraint. CI is unaffected: it always checks out
// a fresh workspace, so this task runs there regardless of this setting.
tasks.withType(Test).configureEach {
  outputs.upToDateWhen { false }
}

dependencies {
  implementation project(':core:network')
  // ArchitectureTest#classImportCoversEveryModuleTheBansMustReach discovers :core:database from
  // the filesystem and fails loudly if none of its classes reach this test's class import — the
  // same reason :testing is pulled in below. Without this line, :core:database's production code
  // (MuPlayDatabase, MediaProgressEntity, MediaProgressDao) would never appear on :app's classpath
  // and the System.currentTimeMillis/Thread.sleep bans, and the nullability-annotation rule, would
  // be silently vacuous for it.
  implementation project(':core:database')
  implementation libs.hilt.android
  annotationProcessor libs.hilt.compiler
  testImplementation libs.junit
  testImplementation libs.truth
  testImplementation libs.archunit
  // Not just for direct use in :app's own tests: this is what puts :testing's classes on
  // :app's test classpath, so ArchitectureTest's ClassFileImporter().importPackages("app.muplay")
  // actually scans app.muplay.testing.* too. Without it, the System.currentTimeMillis/
  // Thread.sleep ArchUnit bans are silently vacuous for :testing (ArchUnit finds zero classes
  // there and the "no classes should..." rule trivially holds). See
  // ArchitectureTest#classImportCoversEveryModuleTheBansMustReach, which fails loudly if this
  // ever stops being true.
  testImplementation project(':testing')

  // The nightly lane's live contract test (app/src/androidTest/java/app/muplay/LiveContractTest.java)
  // runs against a real Navidrome container via `adb reverse`, not in :app's own PR-gate unit
  // tests — see .github/workflows/nightly.yml. No androidTestImplementation project(':core:network')
  // line is needed: confirmed empirically (removed it, ran a clean `./gradlew :app:compileDebugAndroidTestJavaWithJavac`,
  // it still succeeded) that AGP's application-module androidTest variant already extends the
  // tested (main) variant's compile classpath, so :core:network — and, transitively through its
  // own `api project(':core:model')` and `api libs.guava`, MusicLibrary/ServerCapabilities/
  // SubsonicCredentials/ListenableFuture — is already reachable via the `implementation
  // project(':core:network')` declared above. Only what the main variant does not already bring
  // in (JUnit, Truth, and the androidx.test runner AndroidJUnitRunner/InstrumentationRegistry
  // depend on) needs declaring here.
  androidTestImplementation libs.junit
  androidTestImplementation libs.truth
  androidTestImplementation libs.androidx.test.runner
}
