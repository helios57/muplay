[versions]
agp = "9.3.1"
media3 = "1.11.0"
room = "2.8.4"
hilt = "2.60.1"
okhttp = "5.5.0"
retrofit = "3.0.0"
jackson = "2.20.0"
guava = "33.4.8-android"
archunit = "1.5.0"
robolectric = "4.16.1"
truth = "1.4.4"
nullaway = "0.12.7"
errorprone = "2.38.0"
openapiValidator = "3.0.0"
# Pinned below the latest release (14.0.0 at time of writing) deliberately: checkstyle 13.x/14.x
# ship class files compiled for Java 21 (class file major version 65), which a JDK 17 JVM — what
# .github/workflows/pr.yml's setup-java step provisions, matching this project's Java 17 target —
# cannot load at all (UnsupportedClassVersionError). 12.3.1 is the newest release still compiled
# for Java 17 (major version 61). Verify with the same class-file check before bumping this again.
checkstyle = "12.3.1"
slf4j = "2.0.18"
androidxTestRunner = "1.7.0"
# androidx.test:core is released in lockstep with androidx.test:runner (androidxTestRunner above)
# and shares its version number; tracked as its own key rather than reusing androidxTestRunner's
# ref so each artifact's version can be bumped independently if that lockstep ever breaks.
androidxTestCore = "1.7.0"
rxjava = "3.1.10"
rxandroid = "3.0.2"
# Room's Java annotation processor only recognizes androidx.annotation.NonNull (plus a couple of
# other non-JSR-305 spellings — see room-compiler-processing's NONNULL_ANNOTATIONS) when deciding
# whether a @PrimaryKey column is allowed to be non-null; javax.annotation.Nonnull (this project's
# usual JSR-305 annotation, required everywhere else by ArchitectureTest) does not satisfy it.
# compileOnly only: this is read by Room's annotation processor and embedded as a class-retention
# marker, never something a consumer of this module's compiled classes needs on their classpath.
androidxAnnotation = "1.10.0"

[libraries]
media3-exoplayer   = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session     = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-testutils   = { module = "androidx.media3:media3-test-utils", version.ref = "media3" }
media3-testutils-robolectric = { module = "androidx.media3:media3-test-utils-robolectric", version.ref = "media3" }
okhttp             = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver3     = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
retrofit           = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-jackson   = { module = "com.squareup.retrofit2:converter-jackson", version.ref = "retrofit" }
jackson-databind   = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
guava              = { module = "com.google.guava:guava", version.ref = "guava" }
hilt-android       = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler      = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
archunit           = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
robolectric        = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth              = { module = "com.google.truth:truth", version.ref = "truth" }
junit              = { module = "junit:junit", version = "4.13.2" }
nullaway           = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
errorprone-core    = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
openapi-validator  = { module = "com.atlassian.oai:openapi-request-validator-core", version.ref = "openapiValidator" }
jsr305             = { module = "com.google.code.findbugs:jsr305", version = "3.0.2" }
slf4j-nop          = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
room-runtime       = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler      = { module = "androidx.room:room-compiler", version.ref = "room" }
room-rxjava3       = { module = "androidx.room:room-rxjava3", version.ref = "room" }
room-testing       = { module = "androidx.room:room-testing", version.ref = "room" }
rxjava             = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava" }
rxandroid          = { module = "io.reactivex.rxjava3:rxandroid", version.ref = "rxandroid" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library", version.ref = "agp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
errorprone          = { id = "net.ltgt.errorprone", version = "4.1.0" }
