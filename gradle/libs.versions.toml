[versions]
kotlin = "2.4.10"
# plan said agp = "9.0.0"; that resolves fine, but the task instructions require the latest
# *stable* 9.x, not the oldest that resolves. Latest published stable (dl.google.com
# com/android/application/.../maven-metadata.xml) is 9.3.1; 9.4.0 is still alpha-only.
agp = "9.3.1"
# plan said ksp = "2.4.10-2.0.4", assuming the old "<kotlinVersion>-<kspImplVersion>" coupling.
# As of KSP 2.3.0 (2025-10-22) that format is discontinued: KSP is explicitly decoupled from the
# Kotlin compiler version (github.com/google/ksp release notes for 2.3.0: "KSP version is no
# longer tied to the Kotlin compiler version... We wanted to match the Kotlin language version").
# No "2.4.10-*" coordinate exists or ever will under the new scheme. Latest published is 2.3.11
# (com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin maven-metadata.xml) — used it.
ksp = "2.3.11"
composeBom = "2026.08.00"
material3 = "1.4.0"
navigation3 = "1.1.6"
media3 = "1.11.0"
okhttp = "5.5.0"
retrofit = "2.11.0"
serialization = "1.11.0"
coroutines = "1.11.0"
room = "2.8.4"
datastore = "1.2.1"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
coil = "3.5.0"
junit5 = "6.1.3"
assertj = "3.27.7"
turbine = "1.2.1"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
# Not a version the plan named. `compose-ui-test-junit4` pulls espresso-core 3.5.0 in
# transitively, and 3.5.0 cannot run on an API 37 device at all: its
# `InputManagerEventInjectionStrategy` reflects for `android.hardware.input.InputManager
# .getInstance()`, a method that no longer exists there, and every Compose `waitForIdle`
# (which routes through `Espresso.onIdle`) dies with `NoSuchMethodException` before a single
# assertion runs -- observed directly on `muplay37` before this pin existed. 3.7.0 is the latest
# published stable (dl.google.com androidx/test/espresso/espresso-core/maven-metadata.xml).
espresso = "3.7.0"
# Not merely declared: `configureJacoco` (build-logic) declares `jacocoAnt`/`jacocoAgent`
# explicitly from this number and forces every `org.jacoco` module to it, then asserts that the
# *resolved* artifacts really are this version -- the analyzer on every JaCoCo task, the agent on
# every Test task. All of that is needed because setting `jacoco.toolVersion` alone did not bind:
# it read back as this value at every probe point while a 0.8.14 jar did the analysis, and for a
# while this build's Tier 1 gate measured three modules with that instead, which is how a floor
# ended up passing at a minimum of 0.99. Why it did not bind is only partly understood -- see
# `configureJacoco`'s own comment, which separates what was verified from what was not.
# Changing this number changes every measured floor in `coverageFloors`; re-measure them, do not
# just bump it.
jacoco = "0.8.12"
# Compose for Wear OS. A DIFFERENT ARTIFACT FAMILY from `androidx.compose.material3`, not a
# variant of it: the two are not interchangeable, and a watch must use this one.
#
# Resolved against dl.google.com's own maven-metadata while this task ran (2026-08-27). `<latest>`
# is **1.7.0-beta02**; this pins the latest *stable*, 1.6.2, for the same reason the `agp` entry
# above pins 9.3.1 rather than the 9.4.0 alpha -- a shipped application module does not take a
# pre-release compile dependency to be a version newer. Re-read the metadata rather than guessing
# a neighbouring number when this moves.
#
# The two `androidx.wear.compose` artifacts share one version train (both publish 1.6.2 as their
# latest stable), so one ref covers both. `wear-tooling-preview` is on its own train at 1.0.0 and
# gets its own ref for that reason.
wearCompose = "1.6.2"
wearToolingPreview = "1.0.0"
openapiValidator = "3.0.0"
# The Wearable Data Layer, and the ONLY API there is for phone-to-watch messaging: a raw Bluetooth
# socket between two apps that cannot see each other's lifecycles is not an alternative anyone should
# build. Dependency minimalism yields here and the dependency is contained -- `:core:watchlink` alone
# declares it, and exactly one file in that module (`DataLayerWatchLink`) imports it.
#
# Resolved against dl.google.com's own maven-metadata while this task ran (2026-08-30): `<latest>` is
# 20.0.1, and unlike `agp`/`wearCompose` above there is no pre-release question here -- Google Play
# services publishes no alphas to this channel, and 19.0.0 is the previous entry. Re-read the
# metadata rather than guessing a neighbouring number when this moves.
playServicesWearable = "20.0.1"

[libraries]
compose-bom            = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui             = { module = "androidx.compose.ui:ui" }
# `Modifier.animateContentSize`. Version-less, resolved by the BOM like every Compose artifact
# here. It arrives transitively through `foundation` anyway -- so this alias buys no class that was
# not already on the classpath, only the declaration: `:feature:book` names it in prose in its own
# build file, and a dependency you use is one you declare.
compose-animation      = { module = "androidx.compose.animation:animation" }
compose-ui-tooling     = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
# Version-less like `compose-ui-test-junit4` above: resolved by the Compose BOM. It contributes
# nothing but a manifest, declaring the `androidx.activity.ComponentActivity` that
# `createComposeRule()` launches its composition into -- without it every test in a library
# module's Compose suite dies with "Unable to resolve activity for: Intent { ...
# cmp=<module>.test/androidx.activity.ComponentActivity }", which is what `:feature:player`'s
# first instrumented run did, 21/21. It goes on `debugImplementation`, not
# `androidTestImplementation`: a library module's instrumented tests are packaged into a
# self-instrumenting APK whose manifest merges that module's *debug* manifest, so the
# androidTest configuration is too late to contribute one.
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3      = { module = "androidx.compose.material3:material3", version.ref = "material3" }
activity-compose       = { module = "androidx.activity:activity-compose", version = "1.12.0" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.10.0" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.10.0" }
navigation3-runtime    = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui         = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
# Media3 1.11.0. Every coordinate below was resolved against
# https://dl.google.com/dl/android/maven2/androidx/media3/<artifact>/maven-metadata.xml while this
# plan was written; all publish 1.11.0 as <latest>.
media3-exoplayer            = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
# Chapters, and the only place `MetadataRetriever` ships. NOT pulled in by `media3-exoplayer`:
# spike S3 proved that with a `javac` probe -- `androidx.media3.exoplayer.MetadataRetriever` does
# not exist in 1.11.0 at all (deprecated in 1.9, then removed), and
# `androidx.media3.inspector.MetadataRetriever` is in this artifact alone. Plan 4 Task 3 is its
# first consumer; until then the comment here said it was deliberately absent, which was true
# right up to the commit that added it.
media3-inspector            = { module = "androidx.media3:media3-inspector", version.ref = "media3" }
media3-session              = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-datasource-okhttp    = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui-compose           = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-ui-compose-material3 = { module = "androidx.media3:media3-ui-compose-material3", version.ref = "media3" }
okhttp                 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-coroutines      = { module = "com.squareup.okhttp3:okhttp-coroutines", version.ref = "okhttp" }
okhttp-mockwebserver   = { module = "com.squareup.okhttp3:mockwebserver3-junit5", version.ref = "okhttp" }
# The same MockWebServer, without the JUnit 5 extension -- for **instrumented** test classpaths
# only. `okhttp-mockwebserver` above is `mockwebserver3-junit5`, and the extension is the only
# thing it adds; on a device that extension is useless (AndroidJUnitRunner runs JUnit 4) and
# actively fatal: it drags in junit-jupiter-api and junit-platform-commons, both of which package
# `META-INF/LICENSE.md`, and AGP's `mergeDebugAndroidTestJavaResource` refuses the duplicate with
# "2 files found with path 'META-INF/LICENSE.md'". Observed on `:core:media`'s first connected run.
# A `packaging { resources.excludes += ... }` block would also silence it, but that is a module
# `android { }` block `ConventionTest` bans, and it would be papering over a dependency that has
# no business on a device in the first place.
mockwebserver3         = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
retrofit               = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
serialization-json     = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-core        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
hilt-android           = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler          = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
junit-jupiter          = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj                = { module = "org.assertj:assertj-core", version.ref = "assertj" }
turbine                = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
room-runtime           = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler          = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing           = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences  = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-test-core     = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-runner   = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-ext      = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
# `GrantPermissionRule`, and only that. `POST_NOTIFICATIONS` is `dangerous` from API 33: without a
# runtime grant the media notification is silently not posted and `getActiveNotifications()`
# returns an empty array, so every notification assertion would pass on nothing. Granting it from
# a rule keeps that grant beside the test that needs it rather than in an `adb` step someone can
# reorder away -- the same argument `ci/prepare-emulator.sh` makes for doing `adb reverse` in the
# same shell as the test run.
androidx-test-rules    = { module = "androidx.test:rules", version.ref = "androidxTest" }
openapi-validator      = { module = "com.atlassian.oai:openapi-request-validator-core", version.ref = "openapiValidator" }
# Only `:core:watchlink` may declare this -- see that module's build file and `DataLayerWatchLink`.
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
# Coil 3 publishes under io.coil-kt.coil3, not io.coil-kt.
coil-compose           = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp    = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
# The base artifact: ImageLoader/PlatformContext/SingletonImageLoader, none of which
# coil-network-okhttp exposes and none of which :app inherits from :feature:library's own
# implementation-scoped coil-compose dependency. Declared directly in :app, the module that
# builds the image loader (MuPlayApplication).
coil                   = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }

# Wear OS. Only `:wear` may declare these -- see `AndroidWearConventionPlugin`.
wear-compose-material3  = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
# `debugImplementation` only: it exists so `@Preview(device = WearDevices.SMALL_ROUND)` resolves in
# the IDE, and a preview annotation has no business in a release APK.
wear-tooling-preview    = { module = "androidx.wear:wear-tooling-preview", version.ref = "wearToolingPreview" }

# Not in the plan's catalogue draft; added so build-logic/convention can declare these as real
# `implementation` dependencies and apply them programmatically by class from inside the
# convention plugins (the [plugins] block below only aliases plugin *ids* for consumption via
# `alias(libs.plugins.x)` in ordinary module build files — build-logic itself needs the plugin
# jars on its own runtime classpath, or Gradle cannot decorate a Plugin<Project> class that
# references their DSL types). Same pinned version refs as above; no new version numbers
# introduced.
android-gradlePlugin    = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin     = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
# The kotlinx.serialization Kotlin compiler subplugin's own Gradle-plugin marker, separate from
# kotlin-gradlePlugin above (unlike org.jetbrains.kotlin.jvm/.android, which kotlin-gradle-plugin
# registers itself, org.jetbrains.kotlin.plugin.serialization is its own artifact). Lets
# KotlinSerializationConventionPlugin apply it by bare id from build-logic's own classpath, the
# same way every other muplay.* convention plugin applies its underlying plugin.
kotlin-serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradlePlugin        = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin       = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application    = { id = "com.android.application", version.ref = "agp" }
android-library        = { id = "com.android.library", version.ref = "agp" }
# Kept for the catalogue's own completeness, but do not apply this: AGP 9's built-in Kotlin
# support compiles Kotlin sources itself and refuses to build if this plugin is also applied
# ("The 'org.jetbrains.kotlin.android' plugin is no longer required for Kotlin support since AGP
# 9.0" — see AndroidLibraryConventionPlugin, which deliberately does not apply it).
kotlin-android         = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm             = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                   = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
