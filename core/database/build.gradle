plugins {
  id 'com.android.library'
  id 'com.google.dagger.hilt.android'
}

android {
  namespace = 'app.muplay.database'
  compileSdk = 37

  defaultConfig {
    minSdk = 26
    // Matches :app's targetSdk. Needed explicitly here (unlike :core:network, which declares
    // Robolectric as a dependency but has no test that actually runs under
    // RobolectricTestRunner yet): left unset, AGP defaults targetSdk to compileSdk (37), and
    // Robolectric 4.16.1 does not yet support emulating API 37 — DefaultSdkPicker fails every
    // test with "Package targetSdkVersion=37 > maxSdkVersion=36" before any test body runs.
    targetSdk = 36
    // Room's exported schemas are the input to migration tests. Without this the
    // schema is invisible and every future migration is unverifiable.
    javaCompileOptions {
      annotationProcessorOptions {
        arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
      }
    }
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
}

dependencies {
  api project(':core:model')
  api project(':core:network')

  implementation libs.room.runtime
  implementation libs.room.rxjava3
  implementation libs.rxjava
  annotationProcessor libs.room.compiler

  implementation libs.hilt.android
  annotationProcessor libs.hilt.compiler

  implementation libs.guava
  implementation libs.jsr305
  // See the androidxAnnotation entry in gradle/libs.versions.toml: Room's own @PrimaryKey
  // non-null validation only recognizes androidx.annotation.NonNull, not JSR-305.
  compileOnly libs.androidx.annotation

  testImplementation libs.junit
  testImplementation libs.truth
  testImplementation libs.robolectric
  testImplementation libs.room.testing
  testImplementation libs.androidx.test.core
}

// Room's generated implementations are not our code; NullAway must not police them.
tasks.withType(JavaCompile).configureEach {
  options.errorprone.excludedPaths = '.*/build/generated/.*'
}
