plugins {
  alias(libs.plugins.android.application) apply false
  alias(libs.plugins.android.library) apply false
  alias(libs.plugins.hilt) apply false
  alias(libs.plugins.errorprone) apply false
}

// Coverage ratchet floors: JaCoCo branch coverage on every :core:* module (spec §10's "Coverage"
// row: "JaCoCo branch coverage on :core:*, ratcheting"). These are measured, not invented —
// recorded from this commit's actual `./gradlew :core:model:jacocoTestReport
// :core:network:jacocoTestReport` output (each module's own HTML report, "Missed Branches"/"Cov."
// row: :core:model 2/8 = 25%, :core:network 29/32 ≈ 90.6%), truncated to two decimal places so a
// trivial, non-regressing rounding difference in a future JaCoCo point release cannot fail the
// build on its own. "Ratcheting" means these are floors, not targets: they are meant to rise as
// real tests are added over Plans 2+, and jacocoTestCoverageVerification below (wired into the PR
// gate) fails the build if a change lets a module's branch coverage fall below the floor recorded
// here for it. New :core:* modules have no entry until someone measures and adds one.
ext.coreBranchCoverageBaseline = [
    ':core:model'   : 0.25d,
    ':core:network' : 0.90d,
    // :core:database's MediaProgressDaoTest genuinely exercises every DAO method (upsert, find,
    // findAll) via a real in-memory Room database and passes 4/4 — but its own
    // `./gradlew :core:database:jacocoTestReport` output records 0/46 branches covered (report.xml:
    // every one of Room's generated MuPlayDatabase_Impl/MediaProgressDao_Impl branches, and even
    // MediaProgressEntity's own constructor, show missed with zero covered). This is not a dead or
    // undertested module: it is a documented JaCoCo/Robolectric incompatibility — Robolectric loads
    // application classes through its own sandboxed classloader
    // (org.robolectric.internal.bytecode.SandboxClassLoader), which the JaCoCo agent's standard
    // classloader-instrumentation hook never sees, so nothing executed inside a
    // @RunWith(RobolectricTestRunner.class) test is ever recorded as covered regardless of how
    // thoroughly it is actually exercised (see e.g. robolectric/robolectric#5575 and multiple
    // long-standing "Jacoco shows 0% for Robolectric tests" reports; no supported one-line Gradle
    // fix exists as of this commit). :core:database is this project's first module with an actual
    // Robolectric-run test, so this is the first time that gap has surfaced here. 0.00 is the
    // honestly measured floor, not an invented placeholder — it is recorded, not skipped, precisely
    // so this ratchet stays enforced (still fails loudly if the module's total branch count regresses
    // to zero, i.e. goes completely untested) — but note this floor cannot rise through added test
    // coverage alone while this JaCoCo/Robolectric gap persists; investigate the gap itself (e.g. an
    // offline-instrumentation JaCoCo mode) before assuming a future PR's low number here is a real
    // regression.
    ':core:database': 0.00d,
]

subprojects {
  // The root project's own build script (and therefore this subprojects{} block) is evaluated
  // before any subproject's build.gradle has applied its own plugins, and settings.gradle's
  // include(':core:model', ':core:network') also creates an implicit, plugin-less ':core'
  // container project. plugins.withType(JavaBasePlugin) restricts this to subprojects that
  // actually compile Java (java-library, com.android.library, com.android.application all apply
  // JavaBasePlugin) and skips container projects like ':core' that never do.
  //
  // net.ltgt.errorprone is applied here, synchronously (not deferred inside afterEvaluate): the
  // 'errorprone' configuration it creates must exist before the `dependencies { errorprone ... }`
  // block below runs.
  //
  // 'compileOnly', by contrast, is a configuration AGP itself creates, and it does not exist yet
  // this early — AGP is still mid-way through applying JavaBasePlugin when this callback fires
  // reentrantly. That dependency line alone is deferred to afterEvaluate, by which point AGP has
  // finished configuring the subproject.
  plugins.withType(JavaBasePlugin) {
    pluginManager.apply('net.ltgt.errorprone')

    dependencies {
      errorprone libs.errorprone.core
      errorprone libs.nullaway
    }
    afterEvaluate {
      dependencies {
        compileOnly libs.jsr305
        // ArchUnit (and possibly other test-only dependencies) pull in slf4j-api transitively
        // with no binding on the test runtime classpath, so every unit test JVM prints "No SLF4J
        // providers were found... Defaulting to no-operation (NOP) logger" to stderr — noise that
        // would otherwise multiply across every module's test suite in every later plan.
        // slf4j-nop is SLF4J's own purpose-built no-op provider: it satisfies the binding lookup
        // so the warning never fires, without adding any real logging behavior or weight, and
        // testRuntimeOnly keeps it out of the production dependency graph entirely.
        testRuntimeOnly libs.slf4j.nop
      }
    }

    // 'errorprone' (created by the net.ltgt.errorprone plugin) is a dependency-declaration-only
    // configuration (canBeResolved = false) — Android's JavaCompile tasks need an actual resolved
    // FileCollection for options.annotationProcessorPath below, so extend it with a resolvable
    // configuration of our own.
    def errorproneClasspath = configurations.create('errorproneClasspath') {
      canBeConsumed = false
      canBeResolved = true
      extendsFrom configurations.errorprone
    }

    tasks.withType(JavaCompile).configureEach {
      options.compilerArgs += [
        // "-processing" is carved out of "all": javac's -Xlint:processing flags an annotation as
        // unclaimed once processing's final round completes with no further elements to
        // generate. This is a benign round-completion notice from aggregating annotation
        // processors such as Dagger/Hilt's, not a real compilation defect, and would otherwise
        // turn -Werror into a hard, unfixable failure on any module using @HiltAndroidApp.
        '-Xlint:all,-processing',
        '-Werror',
      ]
      options.errorprone {
        enabled = true
        // Dagger/Hilt generates its component implementations into app.muplay (alongside
        // MuPlayApplication) under build/generated/hilt/..., which NullAway's AnnotatedPackages
        // scope below would otherwise hold to the same @NonNull-by-default bar as hand-written
        // code — generated builder classes routinely assign @NonNull fields from a switch with no
        // default case, which NullAway cannot prove exhaustive, so real -Werror build failures
        // resulted from code nobody here wrote or can edit. Every annotation-processor output
        // lives under build/generated, so excluding that whole tree is the standard fix (see
        // errorprone.info's -XepExcludedPaths option) rather than trying to enumerate individual
        // generated file patterns.
        excludedPaths = '.*/build/generated/.*'
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        option('NullAway:AnnotatedPackages', 'app.muplay')
      }
      // net.ltgt.errorprone only auto-wires the 'errorprone' configuration into the standard
      // Gradle `java`/`java-library` source-set annotationProcessor configurations; it has no
      // support for Android's variant-based source sets (confirmed against the plugin's own
      // README, which states Android integration is deliberately left to consumers), so
      // Error Prone — and NullAway with it — silently never runs on :app or :core:network without
      // manually adding it to options.annotationProcessorPath here. That property can't just be
      // assigned during configureEach above, though: AGP sets its own value for
      // options.annotationProcessorPath later, during its variant wiring, which — being a plain
      // property assignment, not a list append — clobbers whatever this configureEach block
      // assigned earlier. doFirst runs at execution time, once all configuration-time mutations
      // (ours and AGP's) have already happened, so appending there is the only place guaranteed
      // to win regardless of registration order. Verified by injecting a deliberate NullAway
      // violation (`String s = null;` passed to a @NonNull-shaped parameter): the build stayed
      // green without this doFirst block, and fails as expected with it.
      doFirst {
        options.annotationProcessorPath =
            (options.annotationProcessorPath ?: project.objects.fileCollection()) +
                errorproneClasspath
      }
    }

    pluginManager.apply('checkstyle')
    checkstyle {
      configFile = rootProject.file('config/checkstyle/checkstyle.xml')
      toolVersion = libs.versions.checkstyle.get()
    }

    pluginManager.apply('jacoco')

    tasks.withType(Test).configureEach {
      finalizedBy tasks.matching { it.name == 'jacocoTestReport' }
      maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
      forkEvery = 100
      maxHeapSize = '4g'
    }

    // The core 'jacoco' plugin only auto-registers a task literally named 'jacocoTestReport' when
    // the 'java'/'java-library' plugin is present (:core:model, :testing). For Android modules
    // (:app, :core:network), applying 'jacoco' instead makes AGP itself register
    // 'create<Variant>UnitTestCoverageReport' (e.g. createDebugUnitTestCoverageReport) — a
    // differently-named but equally real Jacoco HTML/XML report. Left alone, the workflow's single
    // `./gradlew jacocoTestReport` invocation — and the finalizedBy wiring above — would silently
    // produce a report for :core:model and :testing while producing nothing at all for :app and
    // :core:network, exactly the "coverage step that silently produces nothing" failure this gate
    // exists to prevent. Alias every AGP-generated *UnitTestCoverageReport task under the same
    // 'jacocoTestReport' name so one task name means "produce this module's coverage report"
    // everywhere, uniformly.
    //
    // Two reentrancy hazards, both worked around the same way the 'compileOnly' dependency above
    // already is (see that comment): this whole plugins.withType(JavaBasePlugin) callback fires
    // synchronously while AGP is still mid-way through applying itself, so at this point
    // plugins.hasPlugin('com.android.application'/'com.android.library') is still false — AGP has
    // not yet registered itself in the plugins container — and registering a brand-new task here
    // would in any case land inside whatever task-container operation is currently reentering.
    // Deferring to afterEvaluate sidesteps both: by then AGP has finished applying (the plugin
    // check is reliable) and project configuration is no longer nested inside any task-container
    // callback (tasks.register(...) is safe to call directly). The dependsOn target itself stays
    // lazy (tasks.matching {}, not a resolved list) so it still doesn't force AGP's
    // create*UnitTestCoverageReport task into existence until the task graph actually needs it.
    afterEvaluate {
      if (plugins.hasPlugin('com.android.application') || plugins.hasPlugin('com.android.library')) {
        tasks.register('jacocoTestReport') {
          group = 'verification'
          description = 'Generates code coverage report for the unit test task.'
          dependsOn tasks.matching { it.name ==~ /create.*UnitTestCoverageReport/ }
        }

        // The core 'checkstyle' plugin has the exact same gap as 'jacoco' above and for the same
        // reason: it only auto-registers checkstyleMain/checkstyleTest tasks when it finds a
        // JavaPluginExtension-provided sourceSets container (added by the 'java'/'java-library'
        // plugin), which AGP never adds — Android modules get no checkstyle tasks at all from
        // applying the plugin alone. Confirmed empirically: :app and :core:network show zero
        // checkstyle* tasks in `tasks --all` without this. Registering these two tasks by hand,
        // pointed straight at the plain source directories, keeps the task name uniform
        // (checkstyleMain/checkstyleTest everywhere) so a single `./gradlew checkstyleMain
        // checkstyleTest` invocation actually reaches every module's hand-written Java, not just
        // :core:model's and :testing's.
        tasks.register('checkstyleMain', org.gradle.api.plugins.quality.Checkstyle) {
          group = 'verification'
          description = 'Run Checkstyle analysis for main classes.'
          source = fileTree('src/main/java')
          include '**/*.java'
          classpath = files()
        }
        tasks.register('checkstyleTest', org.gradle.api.plugins.quality.Checkstyle) {
          group = 'verification'
          description = 'Run Checkstyle analysis for test classes.'
          source = fileTree('src/test/java')
          include '**/*.java'
          classpath = files()
        }
        tasks.named('check').configure {
          dependsOn tasks.named('checkstyleMain'), tasks.named('checkstyleTest')
        }
      }

      // Confirmed empirically (not from documentation): the core 'jacoco' plugin's auto-registered
      // java-library 'jacocoTestReport' does not, in this Gradle version, dependOn 'test' on its
      // own — running it in isolation (`./gradlew clean jacocoTestReport`, nothing else requested)
      // leaves :core:model's and :testing's 'test' task out of the graph entirely and the report
      // task SKIPPED for missing execution data, silently producing no report. The PR gate's
      // "Coverage" workflow step is exactly that kind of isolated `./gradlew jacocoTestReport`
      // invocation (a separate step from "Unit tests", i.e. a separate `./gradlew` process), so
      // this dependency cannot be left implicit. Wiring it explicitly here makes every module's
      // jacocoTestReport self-sufficient: requesting it alone always (re)runs that module's tests
      // first, so the report always reflects a real, current test run — never stale or absent
      // data. (Redundant but harmless for :app/:core:network, whose alias above already reaches
      // 'test' transitively through create*UnitTestCoverageReport.)
      tasks.named('jacocoTestReport').configure { dependsOn tasks.named('test') }

      // Coverage ratchet (see coreBranchCoverageBaseline above): only :core:* modules with a
      // recorded baseline are gated — :app and :testing are deliberately not in scope, matching
      // the spec's "JaCoCo branch coverage on :core:*" wording exactly.
      def requiredBranchCoverage = rootProject.ext.coreBranchCoverageBaseline[project.path]
      if (requiredBranchCoverage != null) {
        if (tasks.findByName('jacocoTestCoverageVerification') != null) {
          // Plain java-library modules (:core:model today): the core 'jacoco' plugin already
          // registers a real org.gradle.testing.jacoco.tasks.JacocoCoverageVerification task here.
          // It has no rule configured by default, so left alone it passes vacuously regardless of
          // actual coverage — give it the real rule.
          tasks.named('jacocoTestCoverageVerification', org.gradle.testing.jacoco.tasks.JacocoCoverageVerification).configure {
            violationRules {
              rule {
                limit {
                  counter = 'BRANCH'
                  minimum = requiredBranchCoverage
                }
              }
            }
          }
        } else {
          // Android-library modules (:core:network today): AGP's own coverage machinery
          // (com.android.build.gradle.internal.coverage.JacocoReportTask, aliased to
          // jacocoTestReport above) has no verification counterpart at all — confirmed
          // empirically, `:core:network:tasks --all` lists createDebugUnitTestCoverageReport but
          // no jacocoTestCoverageVerification, unlike a plain java-library module. Hand-wiring the
          // standard JacocoCoverageVerification task type against AGP's internal exec-data/
          // class-directory outputs would mean depending on AGP internals nothing else in this
          // build touches. Reading the report.xml AGP's own task already writes (the same counters
          // its HTML report shows, already correctly excluding generated R/BuildConfig classes)
          // avoids that: this enforces exactly the coverage AGP itself reports, rather than
          // reimplementing how AGP computes it.
          def jacocoReportTask = tasks.named('jacocoTestReport')
          tasks.register('jacocoTestCoverageVerification') {
            group = 'verification'
            description =
                "Fails if ${project.path}'s branch coverage has dropped below its recorded" +
                    ' baseline.'
            dependsOn jacocoReportTask
            def xmlReport = layout.buildDirectory.file('reports/coverage/test/debug/report.xml')
            inputs.file(xmlReport)
            doLast {
              File reportFile = xmlReport.get().asFile
              if (!reportFile.exists()) {
                throw new GradleException(
                    "Expected a JaCoCo XML report at ${reportFile} but found none — AGP's own" +
                        ' coverage report task did not produce one, so this verification has' +
                        ' nothing to check and must not pass silently.')
              }
              def factory = javax.xml.parsers.SAXParserFactory.newInstance()
              // The report references report.dtd (JaCoCo's own DTD) but does not ship it
              // alongside the XML, and this must not depend on network access to fetch it on
              // every build — disable external DTD loading and validation outright; this is
              // trusted, generated input, not untrusted external XML.
              factory.setFeature(
                  'http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
              factory.setFeature('http://xml.org/sax/features/validation', false)
              factory.setNamespaceAware(false)
              def report = new groovy.xml.XmlSlurper(factory.newSAXParser()).parse(reportFile)
              def branchCounter = report.counter.find { it.@type.text() == 'BRANCH' }
              if (branchCounter == null || branchCounter.isEmpty()) {
                throw new GradleException(
                    "No top-level BRANCH counter found in ${reportFile} — cannot verify" +
                        ' coverage; investigate rather than trusting a vacuous pass.')
              }
              int missed = Integer.parseInt(branchCounter.@missed.text())
              int covered = Integer.parseInt(branchCounter.@covered.text())
              int total = missed + covered
              if (total == 0) {
                throw new GradleException(
                    "${project.path} recorded zero total branches in ${reportFile} — this" +
                        ' module has apparently gone completely untested; investigate rather' +
                        ' than trusting a vacuous pass.')
              }
              double ratio = (double) covered / total
              if (ratio < requiredBranchCoverage) {
                throw new GradleException(String.format(
                    '%s branch coverage is %.2f%% (%d/%d branches covered), below the recorded' +
                        ' baseline of %.2f%%. Either add tests to restore it, or — if the drop is' +
                        ' deliberate and reviewed — lower coreBranchCoverageBaseline["%s"] in the' +
                        ' root build.gradle to the new measured value.',
                    project.path, ratio * 100, covered, total, requiredBranchCoverage * 100,
                    project.path))
              }
            }
          }
        }
        tasks.named('check').configure { dependsOn tasks.named('jacocoTestCoverageVerification') }
      }
    }
  }
}
