# Gradle's own daemon defaults (512m heap / 384m metaspace, since no gradle.properties existed at
# all before this) genuinely OOM'd and killed the daemon mid-dex-merge on the very first real
# `:app` build under this project's convention plugins (AGP 9 + KSP + Hilt + Compose). -Xmx4g was
# the first fix, tuned only against this 61 GiB dev host — too large for a standard CI runner
# (GitHub Actions' default Linux runner has 7 GiB total, shared with a separate Kotlin compile
# daemon and, from Task 8 on, an emulator). -Xmx2g/768m metaspace is the smallest pair verified
# here to still complete a full `./gradlew clean build` without the GC-thrashing/OOM failure this
# project already hit once — comfortably CI-sized while still real, not guessed.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m

org.gradle.parallel=true
org.gradle.caching=true
