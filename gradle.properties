# Gradle daemon defaults (512m heap / 384m metaspace) are too small for an AGP 9 + KSP + Hilt +
# Compose build — the very first real `:app` build under this project's convention plugins
# thrashed the GC and killed the daemon mid-dex-merge. This host has 61 GiB; give the daemon a
# reasonable share of it rather than tuning against the smallest machine that might run this.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

org.gradle.parallel=true
org.gradle.caching=true
